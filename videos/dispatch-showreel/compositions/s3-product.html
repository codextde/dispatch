      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          const world = document.getElementById("s3-world");
          const stage = document.getElementById("s3-stage");

          // ── Paper iris out of the green flood (continues 02's doorway).
          const paper = document.getElementById("s3-paper");
          const iris = { r: 0 };
          const writeIris = () => (paper.style.clipPath = `circle(${iris.r.toFixed(1)}px at 1722px 518px)`);
          writeIris();
          tl.to(iris, { r: 2000, duration: 0.42, ease: "power3.out", onUpdate: writeIris }, 0.02);

          // ── Camera (3d-camera-flight): one state, one writer, fixed order.
          const cam = { x: 60, y: 60, z: 820, rx: 14, ry: -18, rz: -2 };
          function applyCamera() {
            world.style.transform = `translate3d(${cam.x}px, ${cam.y}px, ${cam.z}px) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg) rotateZ(${cam.rz}deg)`;
          }
          applyCamera();
          // Leg 1 — pull back from the incoming row to the whole workspace (zoom-out-workspace-reveal).
          tl.to(cam, { x: 0, y: 20, z: -40, rx: 9, ry: -9, rz: 0, duration: 1.33, ease: "power3.inOut", onUpdate: applyCamera }, 0.05);
          // Leg 2 — slow drift toward the conversation while the team works it.
          tl.to(cam, { x: -150, y: 60, z: 150, rx: 6, ry: -14, duration: 2.1, ease: "sine.inOut", onUpdate: applyCamera }, 1.4);

          // ── 01 NEW MAIL: the list pushes down, Hannah's mail lands on top.
          tl.fromTo("#s3-rows", { y: -104 }, { y: 0, duration: 0.5, ease: "back.out(1.6)" }, 0.34);
          tl.fromTo("#s3-new", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.34);
          // Discrete UI states are a pure function of scene time (seek-safe, both directions).
          const countEl = document.getElementById("s3-count");
          const reply = document.getElementById("s3-reply-text");
          const clock = { t: 0 };
          function writeStates() {
            countEl.textContent = clock.t >= 0.42 ? "13" : "12";
            reply.textContent = clock.t >= 2.72 ? "Hi Hannah — refund is on its way." : "Reply to Hannah…";
          }
          writeStates();
          tl.fromTo(clock, { t: 0 }, { t: 4, duration: 4, ease: "none", onUpdate: writeStates }, 0);

          // ── Rule fires: Billing label pops, activity line types on.
          tl.fromTo("#s3-billing", { scale: 0, rotation: -12 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2.4)" }, 0.66);
          tl.fromTo("#s3-act", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "power2.out" }, 0.72);

          // ── Maya's cursor → Assign (cursor-click-ripple).
          tl.fromTo("#s3-maya", { x: 1320, y: 760, opacity: 0 }, { x: 1320, y: 760, opacity: 1, duration: 0.1, ease: "none" }, 0.7);
          tl.to("#s3-maya", { x: 1050, y: 140, duration: 0.6, ease: "power3.inOut" }, 0.82);
          tl.to("#s3-maya", { scale: 0.86, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1 }, 1.42);
          tl.to("#s3-assign", { scale: 0.92, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1 }, 1.42);
          tl.set("#s3-ripple", { scale: 0.2, opacity: 0 }, 0);
          tl.to("#s3-ripple", { scale: 1.5, duration: 0.5, ease: "power2.out" }, 1.46);
          tl.to("#s3-ripple", { opacity: 0.9, duration: 0.06, ease: "none" }, 1.46);
          tl.to("#s3-ripple", { opacity: 0, duration: 0.4, ease: "power1.out" }, 1.53);
          tl.fromTo("#s3-assign-empty", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "power1.in" }, 1.5);
          tl.fromTo("#s3-assign-full", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 1.52);

          // ── Internal note grows open (anchored-layout-expand, top-pinned), text types with a live caret.
          tl.fromTo("#s3-note", { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.42, ease: "expo.out" }, 1.78);
          tl.to("#s3-maya", { x: 1110, y: 505, duration: 0.5, ease: "power2.inOut" }, 1.7);
          const NOTE = [
            ["m", "@Sara"],
            ["t", " can you refund the duplicate? I'll reply."],
          ];
          const noteEl = document.getElementById("s3-note-text");
          const full = NOTE.map((p) => p[1]).join("");
          const type = { n: 0 };
          function writeNote() {
            let left = Math.round(type.n);
            let html = "";
            for (const [kind, text] of NOTE) {
              const part = text.slice(0, Math.max(0, left));
              left -= text.length;
              if (!part) break;
              html += kind === "m" ? `<span class="m">${part}</span>` : part.replace("'", "&#39;");
            }
            noteEl.innerHTML = html;
          }
          writeNote();
          tl.to(type, { n: full.length, duration: 0.72, ease: "none", onUpdate: writeNote }, 1.98);
          tl.fromTo("#s3-caret", { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "steps(1)", yoyo: true, repeat: 7 }, 1.98);

          // ── Sara arrives: presence avatars + "is replying" (multi-cursor-choreography).
          tl.fromTo("#s3-sara", { x: 1520, y: 900, opacity: 0 }, { x: 1180, y: 700, opacity: 1, duration: 0.6, ease: "power3.out" }, 2.38);
          tl.fromTo(["#s3-v1", "#s3-v2"], { scale: 0 }, { scale: 1, duration: 0.36, ease: "back.out(2.6)", stagger: 0.1 }, 2.3);
          tl.fromTo("#s3-viewing", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "none" }, 2.28);
          tl.fromTo("#s3-typing", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, 2.5);
          gsap.utils.toArray("#s3-root .s3-dotsx i").forEach((d, i) => {
            tl.fromTo(d, { y: 0 }, { y: -7, duration: 0.16, ease: "sine.inOut", yoyo: true, repeat: 3 }, 2.56 + i * 0.08);
          });
          tl.fromTo("#s3-reply-text", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.45, ease: "none", immediateRender: false }, 2.72);
          tl.to("#s3-sara", { x: 1400, y: 812, duration: 0.3, ease: "power2.inOut" }, 3.0);
          tl.to("#s3-send", { scale: 0.9, duration: 0.07, ease: "power2.in", yoyo: true, repeat: 1 }, 3.28);
          tl.fromTo("#s3-toast", { y: 40, opacity: 0, scale: 0.9 }, { y: 0, opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, 3.34);

          // ── Pinned callouts spring on as each beat lands.
          [["#s3-pin1", 0.46], ["#s3-pin2", 1.56], ["#s3-pin3", 2.02], ["#s3-pin4", 2.5]].forEach(([id, t]) => {
            tl.fromTo(id, { scale: 0.4, opacity: 0, z: 0 }, { scale: 1, opacity: 1, z: 80, duration: 0.4, ease: "back.out(2.2)" }, t);
          });

          tl.fromTo("#s3-chapter", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.3);
          tl.fromTo("#s3-prog", { scaleX: 0 }, { scaleX: 1, duration: 3.6, ease: "none" }, 0.3);

          // ── WHIP (transition out): nudge-curve ramp + linear burst, blur on the lens.
          const blurNode = document.getElementById("s3-whip-blur");
          const blur = { v: 0 };
          const writeBlur = () => {
            blurNode.setAttribute("stdDeviation", `${blur.v.toFixed(2)} 0`);
            stage.style.filter = blur.v > 0.05 ? "url(#s3-whip)" : "none";
          };
          writeBlur();
          tl.to(cam, { x: -420, duration: 0.19, ease: "power3.in", onUpdate: applyCamera }, 3.62);
          tl.to(cam, { x: -1500, duration: 0.18, ease: "none", onUpdate: applyCamera }, 3.81);
          tl.to(blur, { v: 26, duration: 0.2, ease: "power3.in", onUpdate: writeBlur }, 3.62);

          window.__timelines["s3-product"] = tl;
        })();
