# Local development services: Postgres, Mailpit (SMTP catcher) and GreenMail (IMAP/SMTP test server)
#   docker compose -f docker-compose.dev.yml up -d
#   Mailpit UI:   http://localhost:8025   (SMTP on localhost:1025)
#   GreenMail:    IMAP localhost:3143, SMTP localhost:3025 (any user/password auto-created)
name: dispatch-dev
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "5432:5432"
    volumes:
      - dispatch-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled -Dgreenmail.verbose"
    ports:
      - "3025:3025"
      - "3143:3143"
      - "3465:3465"
      - "3993:3993"
volumes:
  dispatch-dev-db:
